# Пропустить приветствие при первом запуске: «Skip» появляется не на первом экране
appId: org.wikipedia
---
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Forward"
    timeout: 60000
- runFlow: skip_rest.yaml
- extendedWaitUntil:
    visible:
      id: "org.wikipedia:id/nav_tab_home"
    timeout: 20000
