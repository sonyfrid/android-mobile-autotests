appId: com.saucelabs.mydemoapp.android
name: "E2E: гость добавляет товар, входит и оформляет заказ"
tags: [smoke, e2e]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Products"
    timeout: 30000
- runFlow: ../subflows/add_first_product.yaml
- tapOn: "View cart"
- tapOn: "Proceed To Checkout"
- runFlow: ../subflows/login_standard.yaml
# адрес доставки
- extendedWaitUntil:
    visible: "Enter a shipping address"
    timeout: 20000
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/fullNameET" }
- inputText: "Rebecca Winter"
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/address1ET" }
- inputText: "Mandorley 112"
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/cityET" }
- inputText: "Truro"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "com.saucelabs.mydemoapp.android:id/zipET" }
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/zipET" }
- inputText: "89750"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "com.saucelabs.mydemoapp.android:id/countryET" }
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/countryET" }
- inputText: "United Kingdom"
- hideKeyboard
- scrollUntilVisible:
    element: "To Payment"
- tapOn: "To Payment"
# оплата (тестовая карта)
- extendedWaitUntil:
    visible: "Enter a payment method"
    timeout: 20000
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/nameET" }
- inputText: "Rebecca Winter"
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/cardNumberET" }
- inputText: "3258125675687891"
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/expirationDateET" }
- inputText: "0325"
- tapOn: { id: "com.saucelabs.mydemoapp.android:id/securityCodeET" }
- inputText: "123"
- hideKeyboard
- scrollUntilVisible:
    element: "Review Order"
- tapOn: "Review Order"
# проверка заказа и оформление
- scrollUntilVisible:
    element: "Place Order"
- tapOn: "Place Order"
- assertVisible: "Checkout Complete"
- takeScreenshot: checkout_complete
- tapOn: "Continue Shopping"
- assertVisible: "Products"
