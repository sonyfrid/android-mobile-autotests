appId: org.wikipedia
name: "03 Saved - статья сохраняется в список"
tags: [smoke]
---
- launchApp:
    clearState: true
- runFlow: ../subflows/skip_onboarding.yaml
- runFlow: ../subflows/open_appium_article.yaml
- tapOn:
    id: "org.wikipedia:id/page_save"
- tapOn: "Saved"
- back
- back
- runFlow:
    when:
      notVisible:
        id: "org.wikipedia:id/nav_tab_reading_lists"
    commands:
      - back
- tapOn:
    id: "org.wikipedia:id/nav_tab_reading_lists"
# первый «Saved» на экране — список, второй — подпись вкладки внизу
- tapOn:
    text: "Saved"
    index: 0
- extendedWaitUntil:
    visible: "Appium"
    timeout: 15000
