appId: com.saucelabs.mydemoapp.android
name: "Каталог открывается, сортировка по цене работает"
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Products"
    timeout: 30000
- assertVisible:
    id: "com.saucelabs.mydemoapp.android:id/titleTV"
    index: 0
- tapOn: "Shows current sorting order and displays available sorting options"
- tapOn: "Ascending order by price"
- assertVisible:
    id: "com.saucelabs.mydemoapp.android:id/priceTV"
    index: 0
- takeScreenshot: catalog_sorted_by_price
