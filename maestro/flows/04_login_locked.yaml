appId: com.saucelabs.mydemoapp.android
name: "Заблокированный пользователь не входит"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Products"
    timeout: 30000
- tapOn: "View menu"
- tapOn: "Log In"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/nameET"
- inputText: "alice@example.com"
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/passwordET"
- inputText: "10203040"
- hideKeyboard
- tapOn: "Tap to login with given credentials"
- assertVisible: "Sorry this user has been locked out."
