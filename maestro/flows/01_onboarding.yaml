- tapOn: "Forward"
- assertNotVisible: "All the world's knowledge"
- tapOn: "Skip"
- assertVisible:
    id: "org.wikipedia:id/nav_tab_reading_lists"
- assertVisible:
    id: "org.wikipedia:id/nav_tab_search"
