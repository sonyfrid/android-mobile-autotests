name: README media

on:
  push:
    branches: [main]
    paths: ['tools/media/**', '.github/workflows/media.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_URL: https://f-droid.org/repo/org.wikipedia_50616.apk
  APK_ARCHIVE_URL: https://f-droid.org/archive/org.wikipedia_50616.apk

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app
        run: mkdir -p apps && (curl -fsSL -o apps/wikipedia.apk "$APK_URL" || curl -fsSL -o apps/wikipedia.apk "$APK_ARCHIVE_URL")

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/media/capture.sh

      - name: Publish raw media to a temporary branch
        if: always()
        run: |
          cd media-out
          rm -f stop
          git init -q -b media-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Raw media from emulator"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media-raw
