name: Android tests

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'tools/discover.py', '.github/workflows/discover.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_URL: https://f-droid.org/repo/org.wikipedia_50616.apk
  APK_ARCHIVE_URL: https://f-droid.org/archive/org.wikipedia_50616.apk

jobs:
  appium:
    name: Appium + WebdriverIO (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies, Appium and UiAutomator2 driver
        run: |
          npm ci
          npm install -g appium
          appium driver install uiautomator2

      - name: Download app
        run: mkdir -p apps && (curl -fsSL -o apps/wikipedia.apk "$APK_URL" || curl -fsSL -o apps/wikipedia.apk "$APK_ARCHIVE_URL")

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 tools/prepare_emulator.py
            npm test

      - name: Allure report
        if: always()
        run: npx --yes allure-commandline generate allure-results --clean -o allure-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-report-api${{ matrix.api-level }}
          path: |
            allure-report
            logs

  maestro:
    name: Maestro (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download app
        run: mkdir -p apps && (curl -fsSL -o apps/wikipedia.apk "$APK_URL" || curl -fsSL -o apps/wikipedia.apk "$APK_ARCHIVE_URL")

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r apps/wikipedia.apk
            python3 tools/prepare_emulator.py
            maestro test maestro/ --format junit --output maestro-report.xml --test-output-dir maestro-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report-api${{ matrix.api-level }}
          path: |
            maestro-report.xml
            maestro-artifacts
